<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1650d8"/>
      <stop offset="1" stop-color="#03113a"/>
    </linearGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4dff9d"/>
      <stop offset="1" stop-color="#00a854"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <rect x="20" y="20" width="20" height="20" fill="#ffffff"/>
      <rect x="20" width="20" height="20" fill="#0b0f1e"/>
      <rect y="20" width="20" height="20" fill="#0b0f1e"/>
    </pattern>
    <clipPath id="rounded"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- jemná mřížka -->
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
      <path d="M0 96H512M0 192H512M0 288H512M0 384H512M96 0V512M192 0V512M288 0V512M384 0V512"/>
    </g>
    <!-- šachovnice dole -->
    <rect x="0" y="452" width="512" height="60" fill="url(#checker)" opacity="0.9"/>
    <!-- světelné čáry -->
    <g stroke="#37e6ff" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <path d="M36 200H120"/>
      <path d="M52 250H108"/>
      <path d="M28 300H132"/>
    </g>
  </g>

  <!-- stopky -->
  <g filter="url(#shadow)">
    <!-- korunka a tlačítka -->
    <rect x="236" y="42" width="40" height="44" rx="10" fill="url(#ring)"/>
    <rect x="216" y="30" width="80" height="26" rx="13" fill="url(#ring)"/>
    <g transform="rotate(-42 256 256)">
      <rect x="236" y="56" width="34" height="34" rx="9" fill="url(#ring)"/>
    </g>
    <!-- prstenec -->
    <circle cx="256" cy="276" r="176" fill="url(#ring)"/>
    <circle cx="256" cy="276" r="146" fill="url(#face)"/>
    <!-- rysky -->
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9">
      <path d="M256 150V174"/>
      <path d="M382 276H358"/>
      <path d="M256 402V378"/>
      <path d="M130 276H154"/>
    </g>
    <!-- ručička -->
    <path d="M256 276 L326 196" stroke="#e10600" stroke-width="18" stroke-linecap="round"/>
    <circle cx="256" cy="276" r="22" fill="#e10600"/>
    <circle cx="256" cy="276" r="9" fill="#ffffff"/>
  </g>
</svg>
