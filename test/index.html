<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test přehrávání v úsporném režimu</title>
<style>
  body{margin:0;padding:16px;background:#120c2e;color:#fff;font:16px/1.4 system-ui,sans-serif}
  h1{font-size:20px} h2{font-size:17px;margin:24px 0 6px}
  p{margin:0 0 8px;color:#c9c4e6}
  img,video{display:block;width:100%;max-width:640px;background:#000;border-radius:8px}
  #state{font-weight:700;color:#ffd23f}
</style>
</head>
<body>
<h1>Test: co se hýbe v úsporném režimu?</h1>
<p>Zapni úsporný režim, načti stránku a <b>ničeho se nedotýkej</b>. Pak napiš, které z okének A, B, C se hýbe.</p>

<h2>A – video jako obrázek</h2>
<img src="../assets/video/f1-1.mp4" alt="A se nenačetlo">

<h2>B – běžné video (tak, jak je to teď)</h2>
<video id="b" src="../assets/video/f1-1.mp4" muted playsinline autoplay loop preload="auto"></video>
<p>Stav B: <span id="state">čekám…</span></p>

<h2>C – animovaný obrázek (WebP)</h2>
<img src="f1-1.webp" alt="C se nenačetlo">

<script>
  const b=document.getElementById('b'), s=document.getElementById('state');
  b.play().then(()=>{ s.textContent='běží'; }).catch(e=>{ s.textContent='telefon přehrání odmítl ('+e.name+')'; });
</script>
</body>
</html>
